models:
  random_forest:
    n_estimators: 100
    max_depth: 10
    min_samples_split: 2
    min_samples_leaf: 1
    max_features: 'log2'
    random_state: 42

  gradient_boosting:
    n_estimators: 100
    learning_rate: 0.1
    max_depth: 3
    min_samples_split: 2
    min_samples_leaf: 1
    subsample: 1.0
    random_state: 42

  svm:
    C: 1.0
    kernel: linear
    probability: true
    random_state: 42

  k_nearest_neighbors:
    n_neighbors: 5
    weights: uniform
    algorithm: auto
    leaf_size: 30


concatenation_path: "data/concatenated_embeddings/"
substrate_name: "chemberta2"
protein_name: "prott5"
project: "gt-substrate-predictor"
group: "rf_optuna_sweep"
wandb_mode: "online"
optuna_sweep: true

n_jobs: 4
max_mem: "8G"