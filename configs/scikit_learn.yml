models:
  majority_classifier:
    strategy: "most_frequent"

  random_classifier:
    strategy: "uniform"

  ridge_classifier:
    alpha: 0.5
    fit_intercept: true

  decision_tree:
    max_depth: 10
    min_samples_split: 2
    random_state: 42

  logistic_regression:
    penalty: l2
    C: 1.0
    solver: lbfgs
    max_iter: 100
    fit_intercept: true
    random_state: 42

  random_forest:
    n_estimators: 100
    max_depth: 10
    min_samples_split: 2
    min_samples_leaf: 1
    max_features: 'log2'
    random_state: 42

  gradient_boosting:
    n_estimators: 100
    learning_rate: 0.1
    max_depth: 3
    min_samples_split: 2
    min_samples_leaf: 1
    subsample: 1.0
    random_state: 42

  svm:
    C: 1.0
    kernel: linear
    probability: true
    random_state: 42

  k_nearest_neighbors:
    n_neighbors: 5
    weights: uniform
    algorithm: auto
    leaf_size: 30

optuna_sweep_configs:
  model: random_forest
  param_distributions:
    n_estimators:
      - 50
      - 100
      - 200
    max_depth:
      - 5
      - 10
      - 20
    min_samples_split:
      - 2
      - 5
      - 10
    max_features:
      - 'sqrt'
      - 'log2'
      - None
    criterion:
      - 'gini'
      - 'entropy'
      - 'log_loss'
concatenation_path: "data/concatenated_embeddings/"
substrate_name: "chemberta2"
protein_name: "prott5"
project: "gt-substrate-predictor"
group: "rf_optuna_sweep"
wandb_mode: "online"
optuna_sweep: true

n_jobs: 4
max_mem: "8G"