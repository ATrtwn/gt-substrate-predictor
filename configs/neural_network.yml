# Neural Network Configuration

# Model architecture
model_type: "attention"  # "simple" (GT_NN), "deep" (DeepMLP), "bilinear" (BilinearInteractionNet), or "attention" (AttentionMLP)
hidden_dims: [512, 256]  # 3 layers total: input->512->256->output
dropout: 0.4  # Dropout rate
projection_dim: 128  # Projection dimension for bilinear model (reduces parameters)

# Attention-specific parameters
num_heads: 4  # Number of attention heads (4 or 8 recommended)
use_residual: true  # Use residual connections in attention model

# Data augmentation
data_augmentation: false  # Enable Gaussian noise augmentation during training
noise_std: 0.02  # Standard deviation for Gaussian noise (0.01-0.05 recommended)

# Training hyperparameters
learning_rate: 0.001
batch_size: 16  # Increased with simpler model
epochs: 100
weight_decay: 0.0005  # Moderate L2 regularization

# Data
concatenation_path: "data/concatenated_embeddings/"
substrate_name: "chemberta3" 
protein_name: "prott5"

# W&B
project: "gt-substrate-predictor"
wandb_mode: "offline"  # "online" or "offline"
