model_type: ["GAT","GIN","SAGE","GATv2","MolecularEGNN"]       # EGNN for 3D graphs
hidden_dims: [64,64]       # hidden_dim for EGNN blocks
dropout: 0.4
num_heads: 4             # only relevant for attention-based GNNs
use_residual: true
data_augmentation: false
noise_std: 0.02

learning_rate: 0.000305
batch_size: 16
epochs: 100
weight_decay: 0.000936
oversample: True

wandb_mode: "offline"
project: "gt-substrate-predictor"

dataset_path: "boltz_processed/pocket_graphs/"
